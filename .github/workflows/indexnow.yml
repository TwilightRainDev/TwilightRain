# Submit live sitemap URLs to IndexNow (not part of the Pages build)
name: IndexNow

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Set IndexNow wait after Pages deploy (push only)
        if: github.event_name == 'push'
        run: echo "INDEXNOW_WAIT_SECONDS=180" >> "$GITHUB_ENV"
      - name: Submit sitemap to IndexNow
        run: node scripts/indexnow-submit.js
