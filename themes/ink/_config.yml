favicon: /img/icon.svg

# 顶部导航：header.ejs 遍历本配置渲染；http(s) 开头视为外链（新标签打开）
# 每项两种形态：
#   字符串          普通链接，如 文章: /
#   对象            二级菜单：url 为父项链接（可选，缺省时父项仅作展开按钮），
#                   children 为子项名 -> 链接（http(s) 开头同样视为外链）
menu:
  文章: /
  分类:
    url: /categories/
    children:
      技术笔记: /categories/技术笔记/
      安全研究: /categories/安全研究/
      项目故事: /categories/项目故事/
      随笔: /categories/随笔/
      标签云: /tags/
      全量归档: /archives/
  搜索: /search/
  展柜:
    url: /projects/
    children:
      项目: /projects/
      技能: /skills/
      时间线: /timeline/
      相册: /gallery/
  关于:
    url: /about/
    children:
      自己: /about/
      友链: /links/
      GitHub: https://github.com/TwilightRainDev
  设置: /settings/

# 首页公告条：留空则不显示
notice: ''

# Giscus 评论系统配置
# 启用方法：
#   1. 在 https://github.com/apps/giscus 安装 App 到仓库
#   2. 在仓库 Settings → General → Discussions 启用 Discussions
#   3. 在 https://giscus.app/ 配置并获取 repo_id 和 category_id
giscus:
  enabled: true
  repo: TwilightRainDev/TwilightRain
  repo_id: R_kgDOTW6QpQ
  category: General
  category_id: DIC_kwDOTW6Qpc4DB7C2
  mapping: pathname
