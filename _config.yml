# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: TwilightRain
subtitle: ''
description: 'TwilightRain 的个人博客，记录技术探索与日常思考'
keywords: 技术博客,个人博客,前端,开发
author: TwilightRain
language: zh-CN
timezone: Asia/Shanghai

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://twilightrain.com
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:
  - 'egg/**' # 彩蛋页：原样拷贝，不套主题布局、不进 sitemap
  - 'mc-viewer/**' # 皮肤 3D 查看器页（about 页 iframe 嵌入用）：原样拷贝，不套主题布局
  - 'BingSiteAuth.xml' # Bing 站点验证文件：原样拷贝到根路径，不得套主题布局或改内容

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: true
  tab_replace: ''
  wrap: true
  hljs: true
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Archive
## 归档页不分页（单页列出全部文章，与页面"共 N 篇"统计一致）
archive_generator:
  per_page: 0

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
## Plugins: https://hexo.io/plugins/
## Themes: https://hexo.io/themes/
theme: ink

# Feed
## 2026-08-17 起双格式：atom.xml + rss2.xml（hexo-generator-feed 4 支持
## type 数组；rss2 兼容性最广，atom 为现行标准，双输出覆盖各阅读器）
feed:
  enable: true
  type:
    - atom
    - rss2
  path:
    - atom.xml
    - rss2.xml
  limit: 20
  hub:
  content: true
  content_limit: 140
  content_limit_delim: ' '
  order_by: -date

# Search
search:
  path: search.xml
  field: post
  content: true
  format: xml

# Sitemap
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  rel: false
  tags: true
  categories: true

# Deployment
## 部署由 Cloudflare Pages 监听 GitHub main 分支自动完成（构建命令 npm run build，输出 public/）
## 无本地部署；历史 hexo-deployer-git（gh-pages 分支）方案已废弃并移除