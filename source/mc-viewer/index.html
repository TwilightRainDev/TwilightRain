<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TwilightRain 皮肤 3D 预览</title>
<style>
  :root {
    --bg-0: #0b0e13;
    --bg-1: #1a2230;
    --ink: #d9dfe8;
    --ink-dim: #8b95a3;
    --accent: #6ee7b7;
    --accent-ink: #06251a;
    --line: rgba(255, 255, 255, 0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: -apple-system, "SF Pro Text", "Segoe UI", "PingFang SC",
      "Microsoft YaHei", "Noto Sans SC", sans-serif;
    color: var(--ink);
    background: radial-gradient(1100px 720px at 50% 18%, var(--bg-1) 0%, var(--bg-0) 62%);
    border-radius: 14px; /* 嵌入 about 页 iframe 时圆角对齐 */
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }

  .page {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
  }

  .viewer-stage {
    position: relative;
    border-radius: 14px;
    border: 1px solid var(--line);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035) 0%, rgba(255, 255, 255, 0.012) 100%);
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.45);
    overflow: hidden;
  }

  #viewer-canvas {
    display: block;
    max-width: 100%;
    height: auto;
  }

  /* 地面柔和阴影 */
  .viewer-stage::after {
    content: "";
    position: absolute;
    left: 50%;
    bottom: 7%;
    width: 46%;
    height: 7%;
    transform: translateX(-50%);
    background: radial-gradient(ellipse at center, rgba(0, 0, 0, 0.5) 0%, transparent 68%);
    pointer-events: none;
  }

  .hint {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 10px;
    text-align: center;
    font-size: 12px;
    color: var(--ink-dim);
    opacity: 0.75;
    letter-spacing: 0.06em;
    pointer-events: none;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .seg {
    display: flex;
    gap: 6px;
  }

  .ctl {
    appearance: none;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: transparent;
    color: var(--ink-dim);
    font: inherit;
    font-size: 13px;
    letter-spacing: 0.03em;
    padding: 7px 16px;
    cursor: pointer;
    transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
  }

  .ctl:hover {
    border-color: rgba(255, 255, 255, 0.22);
    color: var(--ink);
  }

  .ctl.active {
    background: var(--accent);
    border-color: transparent;
    color: var(--accent-ink);
    font-weight: 600;
  }
</style>
</head>
<body>
  <main class="page">
    <section class="viewer-stage">
      <canvas id="viewer-canvas"></canvas>
      <p class="hint">拖拽旋转 | 滚轮缩放</p>
    </section>

    <nav class="controls">
      <button type="button" class="ctl active" data-toggle="rotate">自动旋转</button>
      <button type="button" class="ctl" data-toggle="walk">行走动画</button>
      <div class="seg" role="group" aria-label="臂型">
        <button type="button" class="ctl active" data-model="auto">臂型 自动</button>
        <button type="button" class="ctl" data-model="default">宽臂</button>
        <button type="button" class="ctl" data-model="slim">窄臂</button>
      </div>
    </nav>
  </main>

  <script src="skinview3d.bundle.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
